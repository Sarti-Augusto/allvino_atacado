version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: allvino_evolution_db
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution-pass-2026
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "54322:5432"

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: allvino_evolution_api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=allvino-evolution-key-2026
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution-pass-2026@postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=false
      - LOG_LEVEL=ERROR
      - DEL_INSTANCE=false
      - INSTANCE_EXPIRATION_TIME=0
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  postgres_data:
  evolution_instances:
